<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLTF/GLB Draco Compressor & Decompressor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .dropzone {
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 1.5rem;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.9rem;
        }

        input[type="range"] {
            width: 50%;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        #log {
            background: #020617;
            border-radius: 6px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 150px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 1rem;
        }
    </style>
    <!-- Include Three.js & DRACO Exporter / Loader via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/DRACOExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

<div class="container">
    <h1>3D Model Draco Compressor</h1>
    <p>Convert and compress 3D meshes using client-side WebAssembly Draco encoding.</p>

    <div class="dropzone" id="dropzone">
        <span id="dropzone-text">Drag & Drop .gltf or .glb file here, or click to select</span>
        <input type="file" id="file-input" accept=".gltf,.glb" style="display: none;">
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="quantization">Quantization Level (1-16):</label>
            <input type="range" id="quantization" min="1" max="16" value="11">
            <span id="quant-val">11</span>
        </div>
        <div class="control-group">
            <label for="export-type">Export Format:</label>
            <select id="export-type" style="padding: 0.3rem; border-radius: 4px; background: #0f172a; color: #fff; border: 1px solid #334155;">
                <option value="glb">GLB with Draco Compression</option>
                <option value="drc">Standalone Draco Geometry (.drc)</option>
            </select>
        </div>
    </div>

    <button id="process-btn" disabled>Compress & Download</button>

    <div id="log">Status: Ready. Upload a model to begin.</div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const processBtn = document.getElementById('process-btn');
    const quantizationInput = document.getElementById('quantization');
    const quantVal = document.getElementById('quant-val');
    const exportType = document.getElementById('export-type');
    const logDiv = document.getElementById('log');

    let loadedModel = null;
    let fileName = "model";

    quantizationInput.addEventListener('input', () => {
        quantVal.textContent = quantizationInput.value;
    });

    dropzone.addEventListener('click', () => fileInput.click());

    dropzone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => {
        dropzone.classList.remove('dragover');
    });

    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) {
            handleFile(e.dataTransfer.files[0]);
        }
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            handleFile(e.target.files[0]);
        }
    });

    function log(msg) {
        logDiv.textContent += `\n${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function handleFile(file) {
        fileName = file.name.substring(0, file.name.lastIndexOf('.'));
        document.getElementById('dropzone-text').textContent = `Selected: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        
        log(`Loading ${file.name}...`);
        
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = function (e) {
            const contents = e.target.result;
            const loader = new THREE.GLTFLoader();
            
            // Set up Draco Decoder in case input model is already Draco compressed
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);

            loader.parse(contents, '', (gltf) => {
                loadedModel = gltf.scene;
                log('Model loaded successfully! Ready for compression.');
                processBtn.disabled = false;
            }, (err) => {
                log(`Error parsing model: ${err.message}`);
            });
        };
    }

    processBtn.addEventListener('click', () => {
        if (!loadedModel) return;

        const format = exportType.value;
        const quantBits = parseInt(quantizationInput.value);
        log(`Starting compression using quantization bits: ${quantBits}...`);

        if (format === 'drc') {
            // Compress first mesh using raw DRACOExporter
            let targetMesh = null;
            loadedModel.traverse((child) => {
                if (child.isMesh && !targetMesh) targetMesh = child;
            });

            if (!targetMesh) {
                log("Error: No valid Mesh found in model to compress to .drc");
                return;
            }

            const exporter = new THREE.DRACOExporter();
            const options = {
                compressionLevel: 7,
                quantization: [quantBits, quantBits, quantBits, quantBits, quantBits]
            };

            const result = exporter.parse(targetMesh, options);
            saveArrayBuffer(result, `${fileName}_compressed.drc`);
            log(`Compression complete! Downloade: ${fileName}_compressed.drc`);

        } else {
            // Export GLB with Draco Mesh Compression Options
            const exporter = new THREE.GLTFExporter();
            const options = {
                binary: true,
                dracoOptions: {
                    compressionLevel: 7,
                    quantizationVolume: 'mesh',
                    positionQuantization: quantBits,
                    normalQuantization: quantBits,
                    uvQuantization: quantBits
                }
            };

            exporter.parse(loadedModel, function (gltf) {
                saveArrayBuffer(gltf, `${fileName}_compressed.glb`);
                log(`GLB Draco compression complete! Downloaded: ${fileName}_compressed.glb`);
            }, options);
        }
    });

    function saveArrayBuffer(buffer, filename) {
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }
</script>

</body>
</html>
