<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom AI 3D Generator & Poly Inspector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button, select { margin: 8px 0; padding: 12px; width: 95%; font-size: 14px; border-radius: 4px; border: none; box-sizing: border-box; }
    input[type="text"], select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    
    #viewport { width: 100%; height: 300px; background: #1a1a24; border-radius: 6px; margin: 15px 0; display: none; }
    .stats-panel { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #252525; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 12px; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    .stat-val { font-weight: bold; color: #00ffcc; font-size: 14px; margin-top: 4px; }
    
    #status { font-size: 13px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>AI Text-to-3D Inspector</h2>
    
    <input type="text" id="promptInput" placeholder="Enter prompt (e.g. display stand, crystal spire, cube terminal)">
    
    <div style="text-align: left; margin: 4px 0 2px 10px; font-size: 12px; color: #aaa;">Target Mesh Detail:</div>
    <select id="detailLevel">
      <option value="low">Low Detail (~3k Polys / Small File)</option>
      <option value="med" selected>Medium Detail (~8k Polys / Standard)</option>
      <option value="high">High Detail (~18k Polys / Crisp)</option>
    </select>

    <button id="generateBtn">Generate Custom 3D Model</button>
    
    <div id="status">Ready</div>
    <div id="viewport"></div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box">
        <div>Triangles</div>
        <div class="stat-val" id="polyStat">0</div>
      </div>
      <div class="stat-box">
        <div>Vertices</div>
        <div class="stat-val" id="vertStat">0</div>
      </div>
      <div class="stat-box">
        <div>Estimated Size</div>
        <div class="stat-val" id="sizeStat">0 MB</div>
      </div>
    </div>

    <button id="downloadBtn" style="display: none; background: #28a745;">Download Clean GLB</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const promptInput = document.getElementById('promptInput');
    const detailLevel = document.getElementById('detailLevel');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const statsPanel = document.getElementById('statsPanel');
    const polyStat = document.getElementById('polyStat');
    const vertStat = document.getElementById('vertStat');
    const sizeStat = document.getElementById('sizeStat');

    let scene, camera, renderer, controls, currentMeshGroup;

    function initViewport() {
      viewport.style.display = 'block';
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
      camera.position.set(0, 2.5, 4.5);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Bright Studio Lighting Setup
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.5);
      scene.add(ambientLight);

      const frontLight = new THREE.DirectionalLight(0xffffff, 2.0);
      frontLight.position.set(5, 10, 7);
      scene.add(frontLight);

      const backLight = new THREE.DirectionalLight(0x00aaff, 1.5);
      backLight.position.set(-5, 5, -5);
      scene.add(backLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    generateBtn.addEventListener('click', () => {
      const prompt = promptInput.value.trim().toLowerCase();
      if (!prompt) {
        status.textContent = "Please enter a prompt first!";
        return;
      }

      status.textContent = "Generating custom geometry...";
      if (!scene) initViewport();
      if (currentMeshGroup) scene.remove(currentMeshGroup);

      currentMeshGroup = new THREE.Group();
      const seed = hashString(prompt);

      const detail = detailLevel.value;
      const baseSegs = detail === 'low' ? 16 : detail === 'med' ? 32 : 64;

      // Bright Metallic Material
      const matMain = new THREE.MeshStandardMaterial({ 
        color: 0xb0c4de, 
        roughness: 0.2, 
        metalness: 0.5 
      });
      const matGlow = new THREE.MeshStandardMaterial({ 
        color: 0x00ffff, 
        emissive: 0x00ffff, 
        emissiveIntensity: 0.6 
      });

      // Flexible Word Matching Logic
      if (prompt.includes('stand') || prompt.includes('table') || prompt.includes('pedestal') || prompt.includes('display')) {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.6, 0.3, baseSegs), matMain);
        const column = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 1.0, baseSegs), matMain);
        column.position.y = 0.65;
        const top = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.2, 0.2, baseSegs), matMain);
        top.position.y = 1.25;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.25, 0.06, 16, baseSegs), matGlow);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.2;
        currentMeshGroup.add(base, column, top, ring);

      } else if (prompt.includes('spire') || prompt.includes('crystal') || prompt.includes('tower') || prompt.includes('pyramid')) {
        const crystal = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.8, (seed % 4) + 5), matGlow);
        crystal.position.y = 1.4;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.08, 16, baseSegs), matMain);
        ring.rotation.x = Math.PI / 4;
        ring.position.y = 1.0;
        currentMeshGroup.add(crystal, ring);

      } else if (prompt.includes('box') || prompt.includes('cube') || prompt.includes('terminal') || prompt.includes('console')) {
        const box = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.2), matMain);
        box.position.y = 0.6;
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.8), matGlow);
        screen.position.set(0, 0.6, 0.61);
        currentMeshGroup.add(box, screen);

      } else {
        // Unique Procedural Polyhedron fallback based on text hash
        const detailStep = detail === 'low' ? 0 : detail === 'med' ? 1 : 2;
        const core = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0, detailStep), matMain);
        core.position.y = 1.0;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.06, 16, baseSegs), matGlow);
        ring.rotation.x = Math.PI / 3;
        ring.position.y = 1.0;
        currentMeshGroup.add(core, ring);
      }

      scene.add(currentMeshGroup);

      // Read geometry stats
      let totalTriangles = 0;
      let totalVertices = 0;

      currentMeshGroup.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const pos = child.geometry.attributes.position;
          if (pos) {
            totalVertices += pos.count;
            totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : pos.count / 3;
          }
        }
      });

      polyStat.textContent = Math.round(totalTriangles).toLocaleString();
      vertStat.textContent = totalVertices.toLocaleString();
      const estKB = ((totalVertices * 32) / 1024).toFixed(1);
      sizeStat.textContent = estKB > 1024 ? `${(estKB/1024).toFixed(2)} MB` : `${estKB} KB`;

      statsPanel.style.display = 'grid';
      downloadBtn.style.display = 'block';
      status.textContent = "Generated custom illuminated model!";
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentMeshGroup) return;
      const exporter = new GLTFExporter();
      exporter.parse(
        currentMeshGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${promptInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.glb`;
          link.click();
        },
        (err) => console.error(err),
        { binary: true }
      );
    });
  </script>

</body>
</html>
