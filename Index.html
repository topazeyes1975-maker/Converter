<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>In-Browser 3D Sci-Fi Generator & Inspector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button, select { margin: 8px 0; padding: 12px; width: 95%; font-size: 14px; border-radius: 4px; border: none; box-sizing: border-box; }
    select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    
    #viewport { width: 100%; height: 300px; background: #080808; border-radius: 6px; margin: 15px 0; }
    .stats-panel { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #252525; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 12px; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    .stat-val { font-weight: bold; color: #00ffcc; font-size: 14px; margin-top: 4px; }
    
    #status { font-size: 13px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>Sci-Fi 3D Generator & Inspector</h2>
    
    <select id="presetSelect">
      <option value="pedestal">Sci-Fi Galaxy Display Pedestal</option>
      <option value="spire">Energy Crystal Spire</option>
      <option value="terminal">Control Console Terminal</option>
    </select>

    <div class="stats-panel">
      <div class="stat-box">
        <div>Target Segments</div>
        <select id="detailLevel" style="margin: 0; padding: 4px; width: 100%; font-size: 11px;">
          <option value="low">Low (~3k Polys)</option>
          <option value="med" selected>Medium (~8k Polys)</option>
          <option value="high">High (~18k Polys)</option>
        </select>
      </div>
      <div class="stat-box">
        <div>Triangles</div>
        <div class="stat-val" id="polyStat">0</div>
      </div>
      <div class="stat-box">
        <div>Vertices</div>
        <div class="stat-val" id="vertStat">0</div>
      </div>
    </div>

    <button id="generateBtn">Generate 3D Model</button>
    
    <div id="viewport"></div>
    <div id="status">Ready</div>

    <button id="downloadBtn" style="background: #28a745;">Download Clean GLB (<span id="sizeStat">0 MB</span>)</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const presetSelect = document.getElementById('presetSelect');
    const detailLevel = document.getElementById('detailLevel');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const polyStat = document.getElementById('polyStat');
    const vertStat = document.getElementById('vertStat');
    const sizeStat = document.getElementById('sizeStat');

    let scene, camera, renderer, controls, currentMeshGroup;

    function initViewport() {
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
      camera.position.set(0, 2, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0x00aaff, 1.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    function buildModel() {
      if (!scene) initViewport();
      if (currentMeshGroup) scene.remove(currentMeshGroup);

      currentMeshGroup = new THREE.Group();
      const type = presetSelect.value;
      const detail = detailLevel.value;

      let segs = detail === 'low' ? 12 : detail === 'med' ? 24 : 48;
      const matMain = new THREE.MeshStandardMaterial({ color: 0x22222b, roughness: 0.3, metalness: 0.8 });
      const matGlow = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 });

      if (type === 'pedestal') {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 0.3, segs), matMain);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.05, 16, segs), matGlow);
        ring.rotation.x = Math.PI / 2;
        ring.position.y = 0.16;
        const column = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 1.2, segs), matMain);
        column.position.y = 0.75;
        const top = new THREE.Mesh(new THREE.CylinderGeometry(1.3, 1.0, 0.2, segs), matMain);
        top.position.y = 1.45;

        currentMeshGroup.add(base, ring, column, top);
      } else if (type === 'spire') {
        const base = new THREE.Mesh(new THREE.ConeGeometry(0.8, 2.5, segs), matGlow);
        base.position.y = 1.25;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.08, 16, segs), matMain);
        ring.rotation.x = Math.PI / 3;
        ring.position.y = 1.0;

        currentMeshGroup.add(base, ring);
      } else {
        const base = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 1.0, segs/4, segs/4, segs/4), matMain);
        base.position.y = 0.5;
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.7), matGlow);
        screen.position.set(0, 0.75, 0.51);

        currentMeshGroup.add(base, screen);
      }

      scene.add(currentMeshGroup);

      // Inspect mesh polygon counts
      let totalTriangles = 0;
      let totalVertices = 0;

      currentMeshGroup.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const pos = child.geometry.attributes.position;
          if (pos) {
            totalVertices += pos.count;
            totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : pos.count / 3;
          }
        }
      });

      polyStat.textContent = Math.round(totalTriangles).toLocaleString();
      vertStat.textContent = totalVertices.toLocaleString();

      // Estimate clean binary size
      const estKB = ((totalVertices * 32) / 1024).toFixed(1);
      sizeStat.textContent = estKB > 1024 ? `${(estKB/1024).toFixed(2)} MB` : `${estKB} KB`;
      status.textContent = "Model generated directly in browser!";
    }

    generateBtn.addEventListener('click', buildModel);

    downloadBtn.addEventListener('click', () => {
      if (!currentMeshGroup) return;
      const exporter = new GLTFExporter();
      exporter.parse(
        currentMeshGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${presetSelect.value}_model.glb`;
          link.click();
        },
        (err) => console.error(err),
        { binary: true }
      );
    });

    // Auto load default
    buildModel();
  </script>

</body>
    </html>
