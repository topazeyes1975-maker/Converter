<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Text-to-3D Studio & PolyInspector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 500px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { margin: 8px 0; padding: 12px; width: 95%; font-size: 14px; border-radius: 4px; border: none; box-sizing: border-box; }
    input[type="text"], input[type="password"] { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    
    #viewport { width: 100%; height: 300px; background: #080808; border-radius: 6px; margin: 15px 0; display: none; }
    .stats-panel { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #252525; padding: 12px; border-radius: 6px; margin: 10px 0; font-size: 13px; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    .stat-val { font-weight: bold; color: #00ffcc; font-size: 15px; margin-top: 4px; }
    
    #status { font-size: 14px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>AI Text-to-3D Inspector</h2>
    
    <input type="password" id="hfToken" placeholder="Paste your Hugging Face Token (hf_...)">
    <input type="text" id="promptInput" placeholder="Enter prompt (e.g., sci-fi crystal spire pedestal)">
    
    <button id="generateBtn">Generate & Analyze 3D Model</button>
    <div id="status">Ready</div>

    <div id="viewport"></div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box">
        <div>Triangles</div>
        <div class="stat-val" id="polyStat">0</div>
      </div>
      <div class="stat-box">
        <div>Vertices</div>
        <div class="stat-val" id="vertStat">0</div>
      </div>
      <div class="stat-box">
        <div>File Size</div>
        <div class="stat-val" id="sizeStat">0 MB</div>
      </div>
    </div>

    <button id="downloadBtn" style="display: none; background: #28a745;">Download Verified GLB</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

    const hfToken = document.getElementById('hfToken');
    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const statsPanel = document.getElementById('statsPanel');
    const polyStat = document.getElementById('polyStat');
    const vertStat = document.getElementById('vertStat');
    const sizeStat = document.getElementById('sizeStat');

    let scene, camera, renderer, controls;
    let currentBlob = null;

    function initViewport() {
      viewport.style.display = 'block';
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      viewport.innerHTML = '';
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    generateBtn.addEventListener('click', async () => {
      const token = hfToken.value.trim();
      const prompt = promptInput.value.trim();

      if (!token) {
        status.textContent = "Please paste your Hugging Face Token first!";
        return;
      }
      if (!prompt) {
        status.textContent = "Please enter a text prompt!";
        return;
      }

      generateBtn.disabled = true;
      downloadBtn.style.display = 'none';
      status.textContent = "Sending request to Hugging Face AI...";

      try {
        const response = await fetch("https://api-inference.huggingface.co/models/openai/shap-e", {
          headers: { Authorization: `Bearer ${token}` },
          method: "POST",
          body: JSON.stringify({ inputs: prompt }),
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || "Generation request failed");
        }

        status.textContent = "Model generated! Downloading binary payload...";
        currentBlob = await response.blob();
        
        const sizeMB = (currentBlob.size / (1024 * 1024)).toFixed(2);
        sizeStat.textContent = `${sizeMB} MB`;

        const text = await currentBlob.text();
        const loader = new OBJLoader();
        const objModel = loader.parse(text);

        if (!scene) initViewport();

        // Clear existing models
        scene.children = scene.children.filter(c => c.isLight);

        let totalTriangles = 0;
        let totalVertices = 0;

        objModel.traverse((child) => {
          if (child.isMesh && child.geometry) {
            child.material = new THREE.MeshStandardMaterial({ color: 0x007acc, roughness: 0.4 });
            const pos = child.geometry.attributes.position;
            if (pos) {
              totalVertices += pos.count;
              totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : pos.count / 3;
            }
          }
        });

        scene.add(objModel);
        
        // Center camera on object
        const box = new THREE.Box3().setFromObject(objModel);
        const center = box.getCenter(new THREE.Vector3());
        controls.target.copy(center);

        polyStat.textContent = Math.round(totalTriangles).toLocaleString();
        vertStat.textContent = totalVertices.toLocaleString();
        statsPanel.style.display = 'grid';

        status.textContent = "Done! Inspect polycount & 3D view below.";
        downloadBtn.style.display = 'block';
        generateBtn.disabled = false;

      } catch (err) {
        status.textContent = "Error: " + err.message;
        generateBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentBlob) return;
      const link = document.createElement('a');
      link.href = URL.createObjectURL(currentBlob);
      link.download = promptInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase() + ".obj";
      link.click();
    });
  </script>

</body>
</html>
