<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D GLTF/GLB Draco Compressor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text: #f8fafc;
            --muted: #94a3b8;
            --success: #4ade80;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        p {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .dropzone {
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 1.5rem;
        }

        .dropzone:hover, .dropzone.dragover {
            border-color: var(--accent);
            background-color: rgba(56, 189, 248, 0.05);
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .control-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        input[type="range"] {
            width: 50%;
        }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: background-color 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
            color: #fff;
        }

        button:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
        }

        #log {
            background: #020617;
            border-radius: 6px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 1rem;
            border: 1px solid #334155;
        }
    </style>

    <!-- Three.js Library Stack -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/DRACOExporter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

<div class="container">
    <h1>Robust 3D Draco Compressor</h1>
    <p>Client-side quantization for GLTF and GLB models.</p>

    <div class="dropzone" id="dropzone">
        <span id="dropzone-text">Drag & Drop .gltf or .glb file here, or click to select</span>
        <input type="file" id="file-input" accept=".gltf,.glb" style="display: none;">
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="quantization">Quantization Bits (1=Max Compression, 16=Highest Detail):</label>
            <input type="range" id="quantization" min="1" max="16" value="11">
            <span id="quant-val">11</span>
        </div>
    </div>

    <button id="process-btn" disabled>Compress & Download GLB</button>

    <div id="log">Status: Ready. Upload a .glb or .gltf file to start.</div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const processBtn = document.getElementById('process-btn');
    const quantizationInput = document.getElementById('quantization');
    const quantVal = document.getElementById('quant-val');
    const logDiv = document.getElementById('log');

    let loadedScene = null;
    let rawFileName = "model";
    let originalSizeBytes = 0;

    quantizationInput.addEventListener('input', () => {
        quantVal.textContent = quantizationInput.value;
    });

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropzone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function log(msg, isError = false) {
        const time = new Date().toLocaleTimeString();
        logDiv.textContent += `\n[${time}] ${msg}`;
        if (isError) logDiv.style.color = '#f87171';
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function handleFile(file) {
        rawFileName = file.name.substring(0, file.name.lastIndexOf('.'));
        originalSizeBytes = file.size;
        
        const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
        document.getElementById('dropzone-text').textContent = `File: ${file.name} (${sizeMB} MB)`;
        
        log(`Loading ${file.name}...`);
        
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = function (e) {
            const contents = e.target.result;
            const loader = new THREE.GLTFLoader();
            
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);

            loader.parse(contents, '', (gltf) => {
                loadedScene = gltf.scene;
                
                // Pre-process geometry attributes to prevent Draco export failures
                let meshCount = 0;
                loadedScene.traverse((child) => {
                    if (child.isMesh) {
                        meshCount++;
                        if (!child.geometry.attributes.normal) {
                            child.geometry.computeVertexNormals();
                        }
                    }
                });

                log(`Model loaded successfully! Found ${meshCount} mesh(es). Ready to compress.`);
                processBtn.disabled = false;
            }, (err) => {
                log(`Failed to parse model: ${err.message || err}`, true);
            });
        };
    }

    processBtn.addEventListener('click', () => {
        if (!loadedScene) return;

        processBtn.disabled = true;
        const quantBits = parseInt(quantizationInput.value);
        log(`Compressing geometry with position quantization = ${quantBits} bits...`);

        const exporter = new THREE.GLTFExporter();
        const options = {
            binary: true,
            dracoOptions: {
                compressionLevel: 10,
                quantizationVolume: 'mesh',
                positionQuantization: quantBits,
                normalQuantization: Math.min(quantBits, 10),
                uvQuantization: Math.min(quantBits, 10)
            }
        };

        try {
            exporter.parse(loadedScene, function (glbArrayBuffer) {
                const newSize = glbArrayBuffer.byteLength;
                const reduction = (((originalSizeBytes - newSize) / originalSizeBytes) * 100).toFixed(1);
                
                const origMB = (originalSizeBytes / (1024 * 1024)).toFixed(2);
                const newMB = (newSize / (1024 * 1024)).toFixed(2);

                log(`SUCCESS! Size reduced from ${origMB} MB down to ${newMB} MB (${reduction}% smaller).`);
                
                saveArrayBuffer(glbArrayBuffer, `${rawFileName}_compressed_${quantBits}bit.glb`);
                processBtn.disabled = false;
            }, options);
        } catch (err) {
            log(`Compression error: ${err.message}`, true);
            processBtn.disabled = false;
        }
    });

    function saveArrayBuffer(buffer, filename) {
        const blob = new Blob([buffer], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
    }
</script>

</body>
</html>
