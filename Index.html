<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMD3D Studio & Mesh Inspector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0a0a0c;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }
    .studio-card {
      background: #141419;
      border: 1px solid #282832;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.7);
    }
    h1 {
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 20px;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .input-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #a0a0b0;
      margin-bottom: 6px;
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #2c2c38;
      background: #0d0d12;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0084ff;
    }
    .poly-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
    }
    .poly-btn {
      flex: 1;
      padding: 10px 4px;
      background: #1e1e28;
      border: 1px solid #323242;
      border-radius: 8px;
      color: #a0a0b0;
      font-size: 0.8rem;
      cursor: pointer;
      text-align: center;
    }
    .poly-btn.active {
      background: #0084ff;
      color: #ffffff;
      border-color: #0084ff;
      font-weight: bold;
    }
    .action-btn {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: none;
      background: #0084ff;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .action-btn:disabled {
      background: #444;
      cursor: not-allowed;
    }
    #status {
      margin-top: 14px;
      font-size: 0.85rem;
      text-align: center;
      min-height: 20px;
    }
    .error { color: #ff5555; }
    .success { color: #00ff88; }

    #viewer-container {
      width: 100%;
      height: 280px;
      margin-top: 16px;
      border-radius: 10px;
      background: #050507;
      border: 1px solid #22222e;
      overflow: hidden;
      display: none;
    }

    /* Analysis & Utility Bar */
    .analysis-panel {
      display: none;
      margin-top: 18px;
      background: #0d0d12;
      border-radius: 10px;
      padding: 14px;
      border: 1px solid #22222e;
    }
    .suitability-tag {
      font-size: 0.8rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .tag-good { color: #00ff88; }
    .tag-bad { color: #ff5555; }

    .utility-btns {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .secondary-btn {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #3a3a4c;
      background: #1c1c26;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <div class="studio-card">
    <h1>FMD3D Studio Inspector</h1>
    
    <div class="input-group">
      <label for="promptInput">Search / Prompt Model</label>
      <input type="text" id="promptInput" placeholder="e.g., table, chair, dragon">
 </div>

    <div class="input-group">
      <label>Target Polygon Count</label>
      <div class="poly-selector">
        <div class="poly-btn" onclick="selectPoly('low', 2000, this)">Low (~2k)</div>
        <div class="poly-btn active" onclick="selectPoly('med', 15000, this)">Med (~15k)</div>
        <div class="poly-btn" onclick="selectPoly('high', 50000, this)">High (~50k)</div>
      </div>
    </div>

    <button id="generateBtn" class="action-btn" onclick="generateModel()">Generate 3D Model</button>
    <div id="status"></div>
    <div id="viewer-container"></div>

    <!-- Suitability & Download Bar -->
    <div id="analysisPanel" class="analysis-panel">
      <div id="suitabilityList"></div>
      
      <div class="utility-btns">
        <button class="secondary-btn" onclick="downloadOBJ()">Download OBJ</button>
        <button class="secondary-btn" onclick="generateModel()">Regenerate</button>
      </div>
    </div>
  </div>

  <script>
    let scene, camera, renderer, currentMesh, rawObjText = "";
    let selectedPolyTier = 'med';
    let targetPolyCount = 15000;

    function selectPoly(tier, count, el) {
      selectedPolyTier = tier;
      targetPolyCount = count;
      document.querySelectorAll('.poly-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
    }

    function init3D() {
      const container = document.getElementById("viewer-container");
      container.style.display = "block";
      container.innerHTML = "";

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050507);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1, 3);

      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(2, 4, 3);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040, 2));

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) {
        currentMesh.rotation.y += 0.01;
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    async function generateModel() {
      const prompt = document.getElementById("promptInput").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("generateBtn");
      const analysisPanel = document.getElementById("analysisPanel");

      if (!prompt) {
        status.className = "error";
        status.innerText = "Please enter a search prompt.";
        return;
      }

      btn.disabled = true;
      status.className = "";
      status.innerText = `Generating ${selectedPolyTier.toUpperCase()} poly model...`;
      analysisPanel.style.display = "none";

      try {
        const response = await fetch("https://shiny-glitter-7a52.topazeyes1975.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: prompt, targetPolys: targetPolyCount })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || `Server responded with status ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const textDecoder = new TextDecoder();
        rawObjText = textDecoder.decode(arrayBuffer);

        init3D();

        const loader = new THREE.OBJLoader();
        const obj = loader.parse(rawObjText);

        const box = new THREE.Box3().setFromObject(obj);
        const center = box.getCenter(new THREE.Vector3());
        obj.position.sub(center);

        if (currentMesh) scene.remove(currentMesh);
        currentMesh = obj;
        scene.add(currentMesh);

        status.className = "success";
        status.innerText = "Model generated successfully!";
        
        displaySuitability();
      } catch (err) {
        console.error(err);
        status.className = "error";
        status.innerText = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }

    function displaySuitability() {
      const suitabilityList = document.getElementById("suitabilityList");
      const analysisPanel = document.getElementById("analysisPanel");
      
      let html = "";
      if (selectedPolyTier === 'low') {
        html += `<div class="suitability-tag tag-good">✔ Good for Mobile Games & WebGL Performance</div>`;
        html += `<div class="suitability-tag tag-good">✔ Good for AR Preview Apps</div>`;
        html += `<div class="suitability-tag tag-bad">✖ Not optimal for High-Detail 3D Printing</div>`;
      } else if (selectedPolyTier === 'med') {
        html += `<div class="suitability-tag tag-good">✔ Good for General 3D Web Scenes & Prototyping</div>`;
        html += `<div class="suitability-tag tag-good">✔ Good for Desktop Game Engines</div>`;
        html += `<div class="suitability-tag tag-good">✔ Good for Standard 3D Printing</div>`;
      } else {
        html += `<div class="suitability-tag tag-good">✔ Good for High-Resolution Renders & 3D Printing</div>`;
        html += `<div class="suitability-tag tag-bad">✖ Not recommended for Mobile Browser Games</div>`;
      }

      suitabilityList.innerHTML = html;
      analysisPanel.style.display = "block";
    }

    function downloadOBJ() {
      if (!rawObjText) return;
      const blob = new Blob([rawObjText], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${document.getElementById("promptInput").value.trim() || 'model'}.obj`;
      link.click();
    }
  </script>
</body>
</html>
