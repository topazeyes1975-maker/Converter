<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real AI Text-to-3D Inspector</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 16px;
      outline: none;
    }
    input[type="text"]:focus {
      border-color: #0084ff;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 6px;
      border: none;
      background: #0084ff;
      color: #ffffff;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:disabled {
      background: #555555;
      cursor: not-allowed;
    }
    #status {
      margin-top: 16px;
      font-size: 0.9rem;
      min-height: 24px;
    }
    .error {
      color: #ff5555;
    }
    .success {
      color: #00ff88;
    }
    #viewer-container {
      width: 100%;
      height: 300px;
      margin-top: 20px;
      border-radius: 8px;
      background: #0d0d0d;
      overflow: hidden;
      display: none;
    }
  </style>
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OBJLoader for reading Shap-E 3D output -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <div class="card">
    <h1>Real AI Text-to-3D Inspector</h1>
    <input type="text" id="promptInput" placeholder="Enter prompt (e.g., table)" value="table">
    <button id="generateBtn" onclick="generateModel()">Generate Real AI Model</button>
    <div id="status"></div>
    <div id="viewer-container"></div>
  </div>

  <script>
    let scene, camera, renderer, currentMesh;

    function init3D() {
      const container = document.getElementById("viewer-container");
      container.style.display = "block";
      container.innerHTML = "";

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0d0d0d);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1, 3);

      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(2, 4, 3);
      scene.add(light);
      scene.add(new THREE.AmbientLight(0x404040, 2));

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      if (currentMesh) {
        currentMesh.rotation.y += 0.01;
      }
      if (renderer && scene && camera) {
        renderer.render(scene, camera);
      }
    }

    async function generateModel() {
      const prompt = document.getElementById("promptInput").value.trim();
      const status = document.getElementById("status");
      const btn = document.getElementById("generateBtn");

      if (!prompt) {
        status.className = "error";
        status.innerText = "Please enter a prompt first.";
        return;
      }

      btn.disabled = true;
      status.className = "";
      status.innerText = "Generating 3D Model... (this may take up to 30s)";

      try {
        const response = await fetch("https://shiny-glitter-2a52.topazeyes1975.workers.dev/", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: prompt })
        });

        if (!response.ok) {
          const errorData = await response.json().catch(() => ({}));
          throw new Error(errorData.error || `Server responded with status ${response.status}`);
        }

        const arrayBuffer = await response.arrayBuffer();
        const textDecoder = new TextDecoder();
        const objText = textDecoder.decode(arrayBuffer);

        init3D();

        const loader = new THREE.OBJLoader();
        const obj = loader.parse(objText);

        if (currentMesh) scene.remove(currentMesh);
        currentMesh = obj;
        scene.add(currentMesh);

        status.className = "success";
        status.innerText = "Model generated successfully!";
      } catch (err) {
        console.error(err);
        status.className = "error";
        status.innerText = `Error: ${err.message}`;
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
