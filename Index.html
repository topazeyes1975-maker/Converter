<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBJ to GLB Converter</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #121212; color: #fff; }
    input, button { margin: 10px 0; padding: 10px; font-size: 16px; }
    button { background: #007acc; color: white; border: none; cursor: pointer; borderRadius: 4px; }
  </style>
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js"></script>
  <script src="https://unpkg.com/three@0.160.0/examples/jsm/exporters/GLTFExporter.js"></script>
</head>
<body>

  <h2>Local OBJ to GLB Converter</h2>
  <input type="file" id="fileInput" accept=".obj">
  <br>
  <button id="convertBtn">Convert to GLB</button>
  <p id="status"></p>

  <script type="module">
    import { OBJLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/OBJLoader.js';
    import { GLTFExporter } from 'https://unpkg.com/three@0.160.0/examples/jsm/exporters/GLTFExporter.js';

    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const status = document.getElementById('status');

    convertBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Please select an .obj file first!";
        return;
      }

      status.textContent = "Reading file...";
      const reader = new FileReader();

      reader.onload = function (e) {
        try {
          status.textContent = "Parsing OBJ mesh...";
          const loader = new OBJLoader();
          const object = loader.parse(e.target.result);

          status.textContent = "Exporting to GLB...";
          const exporter = new GLTFExporter();
          exporter.parse(
            object,
            function (glb) {
              const blob = new Blob([glb], { type: 'application/octet-stream' });
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = file.name.replace(/\.[^/.]+$/, "") + ".glb";
              link.click();
              status.textContent = "Done! Download started.";
            },
            function (error) {
              status.textContent = "Export failed: " + error;
            },
            { binary: true }
          );
        } catch (err) {
          status.textContent = "Error processing model: " + err.message;
        }
      };

      reader.readAsText(file);
    });
  </script>

</body>
</html>
