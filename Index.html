<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aggressive 3D GLB Texture & Mesh Compressor</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 { font-size: 1.5rem; margin-top: 0; margin-bottom: 0.5rem; color: var(--accent); }
        p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .dropzone {
            border: 2px dashed #475569;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .dropzone:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.05); }

        .controls { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
        .control-group { display: flex; justify-content: space-between; align-items: center; }

        select, input[type="range"] { background: #0f172a; color: #fff; border: 1px solid #334155; padding: 0.4rem; border-radius: 4px; }

        button {
            background: var(--accent);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
        }

        button:disabled { background: #334155; color: #64748b; cursor: not-allowed; }

        #log {
            background: #020617;
            border-radius: 6px;
            padding: 1rem;
            font-family: monospace;
            font-size: 0.85rem;
            color: #38bdf8;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 1rem;
            border: 1px solid #334155;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/GLTFExporter.js"></script>
</head>
<body>

<div class="container">
    <h1>Aggressive 3D GLB Compressor</h1>
    <p>Forces JPEG texture encoding & Draco mesh quantization.</p>

    <div class="dropzone" id="dropzone">
        <span id="dropzone-text">Drag & Drop .glb file here, or click to select</span>
        <input type="file" id="file-input" accept=".glb,.gltf" style="display: none;">
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="tex-max">Max Texture Size:</label>
            <select id="tex-max">
                <option value="1024" selected>1024 px (Recommended)</option>
                <option value="512">512 px (Ultra Small)</option>
                <option value="2048">2048 px (High Detail)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="tex-quality">JPEG Texture Quality:</label>
            <select id="tex-quality">
                <option value="0.7">70% Quality (Standard)</option>
                <option value="0.5">50% Quality (High Compression)</option>
                <option value="0.85">85% Quality (High Quality)</option>
            </select>
        </div>

        <div class="control-group">
            <label for="quantization">Mesh Quantization:</label>
            <input type="range" id="quantization" min="1" max="16" value="11">
            <span id="quant-val">11</span>
        </div>
    </div>

    <button id="process-btn" disabled>Compress & Download GLB</button>

    <div id="log">Status: Ready. Upload a .glb model.</div>
</div>

<script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const processBtn = document.getElementById('process-btn');
    const quantInput = document.getElementById('quantization');
    const quantVal = document.getElementById('quant-val');
    const texMaxInput = document.getElementById('tex-max');
    const texQualityInput = document.getElementById('tex-quality');
    const logDiv = document.getElementById('log');

    let loadedScene = null;
    let rawFileName = "model";
    let originalSizeBytes = 0;

    quantInput.addEventListener('input', () => quantVal.textContent = quantInput.value);
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => e.preventDefault());
    dropzone.addEventListener('drop', (e) => {
        e.preventDefault();
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFile(e.target.files[0]);
    });

    function log(msg) {
        logDiv.textContent += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
        logDiv.scrollTop = logDiv.scrollHeight;
    }

    function handleFile(file) {
        rawFileName = file.name.substring(0, file.name.lastIndexOf('.'));
        originalSizeBytes = file.size;
        document.getElementById('dropzone-text').textContent = `File: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
        
        log(`Loading ${file.name}...`);
        const reader = new FileReader();
        reader.readAsArrayBuffer(file);
        reader.onload = function (e) {
            const loader = new THREE.GLTFLoader();
            const dracoLoader = new THREE.DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
            loader.setDRACOLoader(dracoLoader);

            loader.parse(e.target.result, '', (gltf) => {
                loadedScene = gltf.scene;
                log('Model loaded! Ready to run aggressive texture compression.');
                processBtn.disabled = false;
            }, (err) => log(`Error: ${err.message}`));
        };
    }

    // Force texture compression via Canvas JPEG conversion
    function compressAndConvertTexture(image, maxDim, quality) {
        const canvas = document.createElement('canvas');
        let width = image.width || image.videoWidth || 1024;
        let height = image.height || image.videoHeight || 1024;

        if (width > height) {
            if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
            }
        } else {
            if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
            }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        
        // Draw image onto white background to safely convert PNG alpha to JPEG
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(image, 0, 0, width, height);

        const compressedImg = new Image();
        compressedImg.src = canvas.toDataURL('image/jpeg', quality);
        return compressedImg;
    }

    processBtn.addEventListener('click', async () => {
        if (!loadedScene) return;
        processBtn.disabled = true;

        const maxTexSize = parseInt(texMaxInput.value);
        const quality = parseFloat(texQualityInput.value);
        const quantBits = parseInt(quantInput.value);

        log(`Compressing textures to JPEG (${maxTexSize}px, ${quality * 100}% quality)...`);

        const texturesToProcess = new Set();
        loadedScene.traverse((child) => {
            if (child.isMesh && child.material) {
                const mat = child.material;
                const maps = [mat.map, mat.normalMap, mat.roughnessMap, mat.metalnessMap, mat.aoMap, mat.emissiveMap];
                maps.forEach(m => { if (m && m.image) texturesToProcess.add(m); });
            }
        });

        let texCount = 0;
        const promises = [];

        texturesToProcess.forEach((tex) => {
            if (tex.image) {
                const compressedImage = compressAndConvertTexture(tex.image, maxTexSize, quality);
                const p = new Promise((resolve) => {
                    compressedImage.onload = () => {
                        tex.image = compressedImage;
                        tex.needsUpdate = true;
                        texCount++;
                        resolve();
                    };
                });
                promises.push(p);
            }
        });

        await Promise.all(promises);
        log(`Successfully encoded ${texCount} texture map(s) into compressed JPEGs. Exporting GLB...`);

        const exporter = new THREE.GLTFExporter();
        const options = {
            binary: true,
            dracoOptions: {
                compressionLevel: 10,
                positionQuantization: quantBits
            }
        };

        exporter.parse(loadedScene, (glbBuffer) => {
            const newSize = glbBuffer.byteLength;
            const reduction = (((originalSizeBytes - newSize) / originalSizeBytes) * 100).toFixed(1);
            
            log(`SUCCESS! Size crushed from ${(originalSizeBytes / 1024 / 1024).toFixed(2)} MB down to ${(newSize / 1024 / 1024).toFixed(2)} MB (${reduction}% smaller).`);
            
            const blob = new Blob([glbBuffer], { type: 'application/octet-stream' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${rawFileName}_compressed.glb`;
            link.click();
            processBtn.disabled = false;
        }, options);
    });
</script>

</body>
</html>
