<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GLB Fast Converter & Draco Optimizer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 450px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button, select { margin: 10px 0; padding: 12px; width: 90%; font-size: 15px; border-radius: 4px; border: none; box-sizing: border-box; }
    select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    .option-group { text-align: left; width: 90%; margin: 10px auto; font-size: 13px; color: #bbb; }
    
    /* Progress Indicator & Spinner */
    #progressContainer { display: none; margin: 15px 0; }
    .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #status { font-size: 14px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
    #progressBar { width: 90%; background-color: #333; border-radius: 4px; margin: 10px auto; overflow: hidden; display: none; }
    #progressFill { width: 0%; height: 10px; background-color: #00ffcc; transition: width 0.2s; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>GLB Converter & Optimizer</h2>
    
    <input type="file" id="fileInput" accept=".glb,.gltf,.obj">
    
    <div class="option-group">
      <label for="polyReduction">Polygon Reduction (Decimation):</label>
      <select id="polyReduction">
        <option value="1.0">Keep Original Polygons (100%)</option>
        <option value="0.5">Reduce Polycount by 50%</option>
        <option value="0.3" selected>Reduce Polycount by 70% (Target ~25 MB)</option>
        <option value="0.15">Aggressive Reduction (85% lower)</option>
      </select>
    </div>

    <button id="convertBtn">Process & Export Compressed GLB</button>
    
    <div id="progressContainer">
      <div class="spinner"></div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
    
    <div id="status">Select a file to start</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
    import { DRACOExporter } from 'three/addons/exporters/DRACOExporter.js';
    import { SimplifyModifier } from 'three/addons/modifiers/SimplifyModifier.js';

    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const polyReduction = document.getElementById('polyReduction');
    const status = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    function updateProgress(percent, message) {
      status.textContent = message;
      if (percent >= 0) {
        progressBar.style.display = 'block';
        progressFill.style.width = percent + '%';
      }
    }

    // Reduces geometry triangle density across loaded meshes
    function decimateScene(scene, ratio) {
      if (ratio >= 1.0) return;
      
      const modifier = new SimplifyModifier();
      scene.traverse((child) => {
        if (child.isMesh && child.geometry) {
          try {
            const count = child.geometry.attributes.position.count;
            const targetCount = Math.floor(count * ratio);
            if (targetCount > 10) {
              const simplifiedGeom = modifier.modify(child.geometry, targetCount);
              child.geometry.dispose();
              child.geometry = simplifiedGeom;
            }
          } catch (e) {
            console.warn("Could not simplify mesh node:", e);
          }
        }
      });
    }

    convertBtn.addEventListener('click', () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Please select a file first!";
        return;
      }

      convertBtn.disabled = true;
      progressContainer.style.display = 'block';
      updateProgress(10, "Reading file from disk...");

      const reader = new FileReader();
      const extension = file.name.split('.').pop().toLowerCase();

      reader.onprogress = (e) => {
        if (e.lengthComputable) {
          const loaded = Math.round((e.loaded / e.total) * 30);
          updateProgress(loaded, `Loading file (${Math.round((e.loaded/e.total)*100)}%)...`);
        }
      };

      reader.onload = async (e) => {
        try {
          updateProgress(40, "Parsing 3D scene geometry...");
          await new Promise(r => setTimeout(r, 50));

          let targetObject;

          if (extension === 'glb' || extension === 'gltf') {
            const loader = new GLTFLoader();
            const gltf = await loader.parseAsync(e.target.result, '');
            targetObject = gltf.scene;
          } else if (extension === 'obj') {
            const loader = new OBJLoader();
            const text = new TextDecoder().decode(e.target.result);
            targetObject = loader.parse(text);
          }

          // Apply mesh decimation if requested
          const reductionRatio = parseFloat(polyReduction.value);
          if (reductionRatio < 1.0) {
            updateProgress(60, "Simplifying mesh geometry...");
            await new Promise(r => setTimeout(r, 50));
            decimateScene(targetObject, reductionRatio);
          }

          updateProgress(80, "Compressing geometry & building GLB...");
          await new Promise(r => setTimeout(r, 50));

          const exporter = new GLTFExporter();
          const dracoExporter = new DRACOExporter();

          exporter.parse(
            targetObject,
            function (glb) {
              updateProgress(100, "Complete! Downloading compressed file...");
              
              const blob = new Blob([glb], { type: 'application/octet-stream' });
              const link = document.createElement('a');
              link.href = URL.createObjectURL(blob);
              link.download = file.name.replace(/\.[^/.]+$/, "") + "_optimized.glb";
              link.click();

              setTimeout(() => {
                progressContainer.style.display = 'none';
                convertBtn.disabled = false;
                const sizeMB = (blob.size / (1024 * 1024)).toFixed(2);
                status.textContent = `Done! Output size: ${sizeMB} MB`;
              }, 1000);
            },
            function (error) {
              status.textContent = "Export failed: " + error;
              progressContainer.style.display = 'none';
              convertBtn.disabled = false;
            },
            { 
              binary: true,
              dracoOptions: {
                compressionLevel: 7
              }
            }
          );

        } catch (err) {
          status.textContent = "Error: " + err.message;
          progressContainer.style.display = 'none';
          convertBtn.disabled = false;
        }
      };

      reader.readAsArrayBuffer(file);
    });
  </script>

</body>
</html>
