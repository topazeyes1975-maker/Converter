<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real AI 3D Generator & Poly Inspector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { margin: 8px 0; padding: 12px; width: 95%; font-size: 14px; border-radius: 4px; border: none; box-sizing: border-box; }
    input[type="text"] { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    
    #viewport { width: 100%; height: 300px; background: #1a1a24; border-radius: 6px; margin: 15px 0; display: none; }
    .stats-panel { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #252525; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 12px; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    .stat-val { font-weight: bold; color: #00ffcc; font-size: 14px; margin-top: 4px; }
    
    #status { font-size: 13px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>Real AI Text-to-3D Inspector</h2>
    
    <input type="text" id="promptInput" placeholder="Enter prompt (e.g. red chair, futuristic car)">
    <button id="generateBtn">Generate Real AI Model</button>
    
    <div id="status">Ready</div>
    <div id="viewport"></div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box">
        <div>Triangles</div>
        <div class="stat-val" id="polyStat">0</div>
      </div>
      <div class="stat-box">
        <div>Vertices</div>
        <div class="stat-val" id="vertStat">0</div>
      </div>
      <div class="stat-box">
        <div>Estimated Size</div>
        <div class="stat-val" id="sizeStat">0 MB</div>
      </div>
    </div>

    <button id="downloadBtn" style="display: none; background: #28a745;">Download Clean GLB</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const PROXY_URL = "https://fragrant-forest-aea4.topazeyes1975.workers.dev";

    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const statsPanel = document.getElementById('statsPanel');
    const polyStat = document.getElementById('polyStat');
    const vertStat = document.getElementById('vertStat');
    const sizeStat = document.getElementById('sizeStat');

    let scene, camera, renderer, controls, currentMeshGroup;

    function initViewport() {
      viewport.style.display = 'block';
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.5, 3);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    generateBtn.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        status.textContent = "Please enter a prompt first!";
        return;
      }

      generateBtn.disabled = true;
      status.textContent = "Calling AI Neural Network (this takes ~15-30s)...";

      try {
        const res = await fetch(PROXY_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt })
        });

        if (!res.ok) throw new Error(`AI Request Failed: ${res.statusText}`);

        const blob = await res.blob();
        const textData = await blob.text();

        if (!scene) initViewport();
        if (currentMeshGroup) scene.remove(currentMeshGroup);

        const loader = new OBJLoader();
        const obj = loader.parse(textData);

        currentMeshGroup = obj;
        
        const box = new THREE.Box3().setFromObject(currentMeshGroup);
        const center = box.getCenter(new THREE.Vector3());
        currentMeshGroup.position.sub(center);

        scene.add(currentMeshGroup);

        let totalTriangles = 0;
        let totalVertices = 0;

        currentMeshGroup.traverse((child) => {
          if (child.isMesh && child.geometry) {
            const pos = child.geometry.attributes.position;
            if (pos) {
              totalVertices += pos.count;
              totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : pos.count / 3;
            }
          }
        });

        polyStat.textContent = Math.round(totalTriangles).toLocaleString();
        vertStat.textContent = totalVertices.toLocaleString();
        const estKB = ((totalVertices * 32) / 1024).toFixed(1);
        sizeStat.textContent = estKB > 1024 ? `${(estKB/1024).toFixed(2)} MB` : `${estKB} KB`;

        statsPanel.style.display = 'grid';
        downloadBtn.style.display = 'block';
        status.textContent = "AI Model Generated Successfully!";

      } catch (err) {
        console.error(err);
        status.textContent = `Error: ${err.message}`;
      } finally {
        generateBtn.disabled = false;
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentMeshGroup) return;
      const exporter = new GLTFExporter();
      exporter.parse(
        currentMeshGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${promptInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.glb`;
          link.click();
        },
        (err) => console.error(err),
        { binary: true }
      );
    });
  </script>

</body>
</html>
