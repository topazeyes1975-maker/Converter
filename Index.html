<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom AI 3D Generator & Inspector</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button { margin: 8px 0; padding: 12px; width: 95%; font-size: 14px; border-radius: 4px; border: none; box-sizing: border-box; }
    input[type="text"] { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    
    #viewport { width: 100%; height: 300px; background: #080808; border-radius: 6px; margin: 15px 0; display: none; }
    .stats-panel { display: none; grid-template-columns: 1fr 1fr 1fr; gap: 8px; background: #252525; padding: 10px; border-radius: 6px; margin: 10px 0; font-size: 12px; }
    .stat-box { background: #1a1a1a; padding: 8px; border-radius: 4px; border: 1px solid #333; }
    .stat-val { font-weight: bold; color: #00ffcc; font-size: 14px; margin-top: 4px; }
    
    #status { font-size: 13px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>AI Text-to-3D Inspector</h2>
    
    <input type="text" id="promptInput" placeholder="Enter custom prompt (e.g. sci-fi galaxy display table)">
    
    <button id="generateBtn">Generate Custom 3D Model</button>
    
    <div id="status">Ready</div>
    <div id="viewport"></div>

    <div class="stats-panel" id="statsPanel">
      <div class="stat-box">
        <div>Triangles</div>
        <div class="stat-val" id="polyStat">0</div>
      </div>
      <div class="stat-box">
        <div>Vertices</div>
        <div class="stat-val" id="vertStat">0</div>
      </div>
      <div class="stat-box">
        <div>Estimated Size</div>
        <div class="stat-val" id="sizeStat">0 MB</div>
      </div>
    </div>

    <button id="downloadBtn" style="display: none; background: #28a745;">Download Clean GLB</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const promptInput = document.getElementById('promptInput');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const status = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const statsPanel = document.getElementById('statsPanel');
    const polyStat = document.getElementById('polyStat');
    const vertStat = document.getElementById('vertStat');
    const sizeStat = document.getElementById('sizeStat');

    let scene, camera, renderer, controls, currentMeshGroup;

    function initViewport() {
      viewport.style.display = 'block';
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
      camera.position.set(0, 2, 4);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(viewport.clientWidth, viewport.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      viewport.appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);
      const dirLight = new THREE.DirectionalLight(0x00aaff, 1.5);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();
    }

    // Hash prompt string into procedural seeds for unique geometry generation
    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash);
    }

    generateBtn.addEventListener('click', () => {
      const prompt = promptInput.value.trim();
      if (!prompt) {
        status.textContent = "Please enter a prompt first!";
        return;
      }

      status.textContent = "Generating custom 3D geometry...";
      if (!scene) initViewport();
      if (currentMeshGroup) scene.remove(currentMeshGroup);

      currentMeshGroup = new THREE.Group();
      const seed = hashString(prompt);

      // Procedural shape variations based on prompt keywords and seed
      const segments = (seed % 24) + 16;
      const matMain = new THREE.MeshStandardMaterial({ color: 0x22222b, roughness: 0.3, metalness: 0.8 });
      const matGlow = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 });

      if (prompt.toLowerCase().includes('table') || prompt.toLowerCase().includes('pedestal')) {
        const base = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.5, 0.3, segments), matMain);
        const top = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.1, 0.2, segments), matMain);
        top.position.y = 1.2;
        const core = new THREE.Mesh(new THREE.TorusGeometry(0.8, 0.1, 12, segments), matGlow);
        core.rotation.x = Math.PI / 2;
        core.position.y = 0.6;
        currentMeshGroup.add(base, top, core);
      } else if (prompt.toLowerCase().includes('spire') || prompt.toLowerCase().includes('crystal')) {
        const crystal = new THREE.Mesh(new THREE.ConeGeometry(0.9, 2.8, (seed % 6) + 5), matGlow);
        crystal.position.y = 1.4;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.1, 0.08, 16, segments), matMain);
        ring.rotation.x = Math.PI / 4;
        ring.position.y = 1.0;
        currentMeshGroup.add(crystal, ring);
      } else {
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(1.0, (seed % 3) + 1), matMain);
        core.position.y = 1.0;
        const ring = new THREE.Mesh(new THREE.TorusGeometry(1.4, 0.05, 16, segments), matGlow);
        ring.rotation.x = Math.PI / 3;
        ring.position.y = 1.0;
        currentMeshGroup.add(core, ring);
      }

      scene.add(currentMeshGroup);

      // Analyze geometry
      let totalTriangles = 0;
      let totalVertices = 0;

      currentMeshGroup.traverse((child) => {
        if (child.isMesh && child.geometry) {
          const pos = child.geometry.attributes.position;
          if (pos) {
            totalVertices += pos.count;
            totalTriangles += child.geometry.index ? child.geometry.index.count / 3 : pos.count / 3;
          }
        }
      });

      polyStat.textContent = Math.round(totalTriangles).toLocaleString();
      vertStat.textContent = totalVertices.toLocaleString();
      const estKB = ((totalVertices * 32) / 1024).toFixed(1);
      sizeStat.textContent = estKB > 1024 ? `${(estKB/1024).toFixed(2)} MB` : `${estKB} KB`;

      statsPanel.style.display = 'grid';
      downloadBtn.style.display = 'block';
      status.textContent = "Generated custom model from prompt!";
    });

    downloadBtn.addEventListener('click', () => {
      if (!currentMeshGroup) return;
      const exporter = new GLTFExporter();
      exporter.parse(
        currentMeshGroup,
        (glb) => {
          const blob = new Blob([glb], { type: 'application/octet-stream' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${promptInput.value.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.glb`;
          link.click();
        },
        (err) => console.error(err),
        { binary: true }
      );
    });
  </script>

</body>
</html>
