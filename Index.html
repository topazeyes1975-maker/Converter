<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate WebGL GLB Optimizer</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #121212; color: #fff; text-align: center; margin: 0; }
    .card { background: #1e1e1e; padding: 20px; border-radius: 8px; max-width: 480px; margin: 20px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    input, button, select { margin: 10px 0; padding: 12px; width: 90%; font-size: 15px; border-radius: 4px; border: none; box-sizing: border-box; }
    select { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #007acc; color: white; font-weight: bold; cursor: pointer; }
    button:disabled { background: #444; cursor: not-allowed; }
    .option-group { text-align: left; width: 90%; margin: 10px auto; font-size: 13px; color: #bbb; }
    
    #progressContainer { display: none; margin: 15px 0; }
    .spinner { border: 4px solid #333; border-top: 4px solid #00ffcc; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 10px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    #status { font-size: 14px; color: #00ffcc; margin-top: 8px; font-weight: bold; }
    #progressBar { width: 90%; background-color: #333; border-radius: 4px; margin: 10px auto; overflow: hidden; display: none; }
    #progressFill { width: 0%; height: 10px; background-color: #00ffcc; transition: width 0.2s; }
  </style>

  <script type="importmap">
    {
      "imports": {
        "@gltf-transform/core": "https://cdn.jsdelivr.net/npm/@gltf-transform/core@3.10.1/+esm",
        "@gltf-transform/functions": "https://cdn.jsdelivr.net/npm/@gltf-transform/functions@3.10.1/+esm"
      }
    }
  </script>
</head>
<body>

  <div class="card">
    <h2>Ultimate GLB Pipeline</h2>
    
    <input type="file" id="fileInput" accept=".glb,.gltf">
    
    <div class="option-group">
      <label for="preset">Optimization Preset:</label>
      <select id="preset">
        <option value="balanced" selected>Ultimate Balanced (Quantize + Weld + Prune)</option>
        <option value="max">Max Compression (Aggressive Quantization)</option>
      </select>
    </div>

    <button id="convertBtn">Run Full Pipeline & Export</button>
    
    <div id="progressContainer">
      <div class="spinner"></div>
      <div id="progressBar"><div id="progressFill"></div></div>
    </div>
    
    <div id="status">Select a GLB file to start</div>
  </div>

  <script type="module">
    import { WebIO } from '@gltf-transform/core';
    import { weld, quantize, prune, dedup, resample } from '@gltf-transform/functions';

    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const presetSelect = document.getElementById('preset');
    const status = document.getElementById('status');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');

    function updateProgress(percent, message) {
      status.textContent = message;
      if (percent >= 0) {
        progressBar.style.display = 'block';
        progressFill.style.width = percent + '%';
      }
    }

    convertBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        status.textContent = "Please select a file first!";
        return;
      }

      convertBtn.disabled = true;
      progressContainer.style.display = 'block';
      updateProgress(10, "Loading WebAssembly pipeline...");

      try {
        const io = new WebIO();
        const arrayBuffer = await file.arrayBuffer();
        
        updateProgress(30, "Parsing 3D document structures...");
        await new Promise(r => setTimeout(r, 50));
        const doc = await io.readBinary(new Uint8Array(arrayBuffer));

        updateProgress(50, "Cleaning duplicate vertices & buffers...");
        await new Promise(r => setTimeout(r, 50));
        await doc.transform(
          weld(),
          dedup(),
          prune()
        );

        updateProgress(75, "Quantizing vertex data & attributes...");
        await new Promise(r => setTimeout(r, 50));
        
        const isMax = presetSelect.value === 'max';
        await doc.transform(
          quantize({
            quantizePosition: isMax ? 12 : 14,
            quantizeNormal: isMax ? 8 : 10,
            quantizeTexcoord: isMax ? 10 : 12
          })
        );

        updateProgress(90, "Packaging optimized GLB binary...");
        await new Promise(r => setTimeout(r, 50));
        const compressedGlb = await io.writeBinary(doc);

        updateProgress(100, "Complete! Downloading file...");
        
        const blob = new Blob([compressedGlb], { type: 'application/octet-stream' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = file.name.replace(/\.[^/.]+$/, "") + "_ultimate.glb";
        link.click();

        setTimeout(() => {
          progressContainer.style.display = 'none';
          convertBtn.disabled = false;
          const originalMB = (file.size / (1024 * 1024)).toFixed(2);
          const newMB = (blob.size / (1024 * 1024)).toFixed(2);
          status.textContent = `Done! Reduced from ${originalMB} MB down to ${newMB} MB`;
        }, 1000);

      } catch (err) {
        status.textContent = "Optimization Error: " + err.message;
        progressContainer.style.display = 'none';
        convertBtn.disabled = false;
      }
    });
  </script>

</body>
</html>
